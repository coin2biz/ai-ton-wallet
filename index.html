<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TON WALLET</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.34/dist/tonweb.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#000;color:#fff;font-family:Arial;padding:10px;margin:0}.top{text-align:center;font-size:24px;font-weight:900;padding:16px;color:#f5c842}.card{background:#1a1a1a;border:1px solid #333;border-radius:18px;padding:16px;margin:10px auto;max-width:420px;text-align:center}.bal{font-size:36px;font-weight:900}.ton{color:#22c55e;margin-top:6px;font-weight:700}.btn{background:#f5c842;color:#000;border:0;width:100%;padding:14px;border-radius:12px;font-weight:900;margin-top:12px;font-size:16px}.btn2{background:#222;color:#f5c842;border:1px solid #444;width:100%;padding:11px;border-radius:10px;margin-top:8px}.qrbox{background:#fff;padding:8px;border-radius:12px;width:120px;height:120px;margin:12px auto;display:flex;align-items:center;justify-content:center}.addr{font-family:monospace;font-size:10px;word-break:break-all;color:#aaa;margin-top:8px}</style></head><body><div class="top">AI TON WALLET MINI</div><div class="card"><div class="bal" id="bal">$0.00</div><div class="ton" id="tbal">Ready</div><button class="btn" onclick="gen()">GENERATE WALLET</button><button class="btn2" onclick="bal()">CHECK BALANCE</button><div id="msg" style="color:#22c55e;font-size:12px;margin-top:8px">Click Generate</div></div><div class="card"><div style="color:#f5c842;font-weight:800">Address</div><div class="qrbox"><div id="qr"></div></div><div id="addr" class="addr">Not generated</div></div><script>let tg={};try{tg=window.Telegram.WebApp;tg.expand();tg.ready();}catch(e){}let cur="";function showQR(t){document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:t,width:110,height:110});}async function gen(){document.getElementById('msg').innerText='Generating...';try{let tonweb=new TonWeb();let kp=tonweb.utils.nacl.sign.keyPair();let WC=tonweb.wallet.all.v4R2;let w=new WC(new TonWeb.HttpProvider('https://toncenter.com/api/v2/jsonRPC'),{publicKey:kp.publicKey});let a=await w.getAddress();cur=a.toString(true,true,true);document.getElementById('addr').innerText=cur;showQR(cur);document.getElementById('msg').innerText='Wallet OK - '+cur.slice(0,12)+'...';document.getElementById('tbal').innerText='New wallet - send TON';try{tg.HapticFeedback.notificationOccurred('success');}catch(e){}}catch(e){document.getElementById('msg').innerText='Error: '+e.message;alert(e.message);}}async function bal(){if(!cur){alert('Generate first');return;}document.getElementById('tbal').innerText='Checking...';try{let r=await fetch('https://toncenter.com/api/v2/jsonRPC',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:1,jsonrpc:"2.0",method:"getAddressBalance",params:{address:cur}})});let j=await r.json();let t=parseInt(j.result)/1e9;document.getElementById('bal').innerText='$'+(t*3.2).toFixed(2);document.getElementById('tbal').innerText=t.toFixed(4)+' TON';}catch(e){document.getElementById('tbal').innerText='Check failed';}}showQR('READY');</script></body></html>
