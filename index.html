<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI TON WALLET</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:15px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:15px;padding:15px;margin:10px 0}
.btn{background:#f5c842;color:#000;border:0;padding:15px;width:100%;border-radius:12px;font-weight:900;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.word{background:#000;color:#f5c842;border:1px solid #444;padding:10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<h2 style="text-align:center">AI TON WALLET</h2>
<div class="card" style="text-align:center">
<div style="font-size:32px;font-weight:900">$44.67</div>
<div style="color:#0f0">12.4587 TON</div>
<button class="btn" onclick="generate()">GENERATE WALLET</button>
<div id="msg" style="margin-top:10px;font-size:12px"></div>
</div>
<div class="card" id="box" style="display:none;background:#f5c842;color:#000">
<b>Your 24 Words:</b>
<div class="grid" id="grid"></div>
</div>
<script>
function generate(){
const list=["abandon","ability","able","about","above","absent","absorb","abstract","absurd","abuse","access","accident","account","accuse","achieve","acid","acoustic","acquire","across","act","action","actor","actress","actual","adapt","add","addict","address","adjust","admit","adult","advance","advice","aerobic","affair","afford","afraid","again","age","agent","agree","ahead","aim","air","airport","aisle","alarm","album","alcohol","alert","alien","all","alley","allow","almost","alone","alpha","already","also","alter","always","amateur","amazing","among","amount","amused","analyst","anchor","ancient","anger","angle","angry","animal","ankle","announce","annual","another","answer","antenna","antique","anxiety","any","apart","apology","appear","apple","approve","april","arch","arctic","area","arena","argue","arm","armed","armor","army","around","arrange","arrest","arrive","arrow","art","artefact","artist","artwork","ask","aspect","assault","asset","assist","assume","asthma","athlete","atom","attack","attend","attitude","attract","auction","audit","august","aunt","author","auto","autumn","average","avocado","avoid","awake","aware","away","awesome","awful","awkward","axis","baby","bachelor","bacon","badge","bag","balance","balcony","ball","bamboo","banana","banner","bar","barely","bargain","barrel","base","basic","basket","battle","beach","bean","beauty","because","become","beef","before","begin","behave","behind","believe","below","belt","bench","benefit","best","betray","better","between","beyond","bicycle","bid","bike","bind","biology","bird","birth","bitter","black","blade","blame","blanket","blast","bleak","bless","blind","blood","blossom","blouse","blue","blur","blush","board","boat","body","boil","bomb","bone","bonus","book","boost","border","boring","borrow","boss","bottom","bounce","box","boy","bracket","brain","brand","brass","brave","bread","breeze","brick","bridge","brief","bright","bring","brisk","broccoli","broken","bronze","broom","brother","brown","brush","bubble","buddy","budget","buffalo","build","bulb","bulk","bullet","bundle","bunker","burden","burger","burst","bus","business","busy","butter","buyer","buzz"];
let words=[];
for(let i=0;i<24;i++){
let r=Math.floor(Math.random()*list.length);

}
let grid=document.getElementById('grid');

words.forEach((w,i)=>{

});
document.getElementById('box').style.display='block';

}
</script>
</body>
</html>
