                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TON WALLET</title><script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0a;color:#fff;min-height:100vh;padding:16px}.c{max-width:400px;margin:auto;background:#161616;border:1px solid #FFD700;border-radius:20px;padding:20px;text-align:center}h1{color:#FFD700;font-size:20px}input{width:100%;padding:14px;margin:8px 0;background:#1e1e1e;border:1px solid #333;border-radius:12px;color:#fff}button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer}.g{background:#FFD700;color:#000}.d{background:#222;color:#fff;border:1px solid #333}#a{color:#FFD700;font-weight:bold;font-size:12px;word-break:break-all}</style></head><body><div class="c"><div style="font-size:40px">💎</div><h1>AI TON WALLET</h1><p style="color:#888;font-size:12px">REAL TON CONNECT • Chennai</p><div id="ton-connect" style="margin:15px 0"></div><div id="wi" style="display:none;background:#1e1e1e;border-radius:12px;padding:10px;margin:10px 0"><div>Wallet: <span id="ad"></span></div><div>Bal: <span id="ba">...</span></div></div><input id="to" placeholder="Recipient UQ... / EQ..."><input id="am" type="number" step="0.01" placeholder="Amount TON (e.g. 0.05)"><button class="g" id="sb">⚡ Send TON</button><button class="d" id="db" style="display:none">Disconnect</button><div id="st" style="display:none;background:#1e1e1e;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;word-break:break-all"></div></div><script>
const ui=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://ai-ton-wallet.onrender.com/tonconnect-manifest.json',buttonRootId:'ton-connect'});
const ad=document.getElementById('ad'),wi=document.getElementById('wi'),ba=document.getElementById('ba'),db=document.getElementById('db'),st=document.getElementById('st');
ui.onStatusChange(async w=>{if(w){wi.style.display='block';db.style.display='block';ad.textContent=w.account.address.slice(0,6)+'...'+w.account.address.slice(-6);ad.title=w.account.address;try{let r=await fetch('https://toncenter.com/api/v2/jsonRPC',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:1,jsonrpc:'2.0',method:'getAddressInformation',params:{address:w.account.address}})});let d=await r.json();ba.textContent=d.result?(parseInt(d.result.balance)/1e9).toFixed(4)+' TON':'0 TON'}catch{ba.textContent='0 TON'}}else{wi.style.display='none';db.style.display='none'}});
document.getElementById('sb').onclick=async()=>{let t=document.getElementById('to').value.trim(),a=document.getElementById('am').value.trim();if(!ui.wallet){alert('Connect first');return}if(!t||!a){alert('Enter address+amount');return}try{st.style.display='block';st.textContent='⏳ Approve in Tonkeeper...';let tx={validUntil:Math.floor(Date.now()/1000)+600,messages:[{address:t,amount:(parseFloat(a)*1e9).toString()}]};let r=await ui.sendTransaction(tx);st.innerHTML='✅ Sent! <a href="https://tonscan.org" style="color:#FFD700" target="_blank">View</a>'}catch(e){st.style.display='block';st.textContent='❌ '+(e.message||'Rejected')}};db.onclick=()=>ui.disconnect();
</script></body></html>
