DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TON</title><script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script><style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}.card{max-width:400px;margin:auto;background:#111;border:2px solid gold;border-radius:12px;padding:12px}.tab{flex:1;padding:8px;border:1px solid #333;background:#222;color:#fff}.tab.active{background:gold;color:#000}input,select{width:88%;padding:10px;margin:6px;border-radius:6px;background:#1a1a1a;color:#fff;border:1px solid #333}button{background:gold;color:#000;font-weight:bold;padding:11px;width:92%;border:none;border-radius:8px}</style></head><body><h3 style="color:gold">⚡ AI TON WALLET - FIXED</h3><div class="card"><div id="c"></div><div style="display:flex;gap:6px"><button class="tab active" id="a">SEND</button><button class="tab" id="b">SWAP</button></div><div id="p1"><input id="to" placeholder="UQ..."><input id="am" placeholder="0.05"><button id="s1">Send</button></div><div id="p2" style="display:none"><select id="f"><option>GRAM</option><option>USDT</option></select><select id="tt"><option>USDT</option><option>GRAM</option></select><input id="sa" placeholder="0.2"><button id="s2">Swap GRAM to USDT </button></div><p id="st"></p></div><script>const ui=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://ai-ton-wallet.onrender.com/tonconnect-manifest.json',buttonRootId:'c'});a.onclick=()=>{p1.style.display='block';p2.style.display='none';a.classList.add('active');b.classList.remove('active')};b.onclick=()=>{p1.style.display='none';p2.style.display='block';b.classList.add('active');a.classList.remove('active')};s1.onclick=async()=>{try{await ui.sendTransaction({validUntil:Date.now()/1000+600|0,messages:[{address:to.value,amount:(+am.value*1e9)+''}]});st.innerText='Sent'}catch(e){st.innerText='Fail'}};s2.onclick=()=>{let v=sa.value||'0.2';let url=f.value=='TON'?'https://app.ston.fi/swap?from=TON&to=USDT&fa='+v:'https://app.ston.fi/swap?from=USDT&to=TON&fa='+v;window.open(url,'_blank');st.innerText='Fixed! TON->USDT no GRAM'};f.onchange=()=>{tt.value=f.value=='TON'?'USDT':'TON';s2.innerText='Swap '+f.value+' to '+tt.value+' - NO GRAM'}</script></body></html>
