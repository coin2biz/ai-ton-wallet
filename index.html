<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TON WALLET</title><script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0a;color:#fff;padding:14px}.c{max-width:400px;margin:auto;background:#161616;border:1px solid gold;border-radius:18px;padding:18px;text-align:center}input{width:100%;padding:13px;margin:7px 0;background:#1e1e1e;border:1px solid #333;border-radius:10px;color:#fff}button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;margin-top:8px}.g{background:gold;color:#000}.l{color:gold;text-decoration:underline;display:block;margin:6px 0}</style></head><body><div class=c><div style=font-size:38px>💎</div><h2 style=color:gold>AI TON WALLET</h2><p style=color:#888;font-size:11px>REAL SEND • TONSCAN • Chennai</p><div id=ton-connect style=margin:14px 0></div><div id=wi style=display:none;background:#1e1e1e;border-radius:10px;padding:8px;font-size:12px>Wallet:<span id=ad></span><br>Bal:<span id=ba>...</span></div><input id=to placeholder="Recipient UQ... / EQ..."><input id=am type=number step=0.01 placeholder="Amount e.g 0.05"><button class=g id=sb>⚡ Send TON</button><button id=db style=display:none;background:#222;color:#fff;border:1px solid #333;margin-top:6px;width:100%;padding:13px;border-radius:10px>Disconnect</button><div id=st style=display:none;background:#111;border:1px solid gold;border-radius:10px;padding:10px;margin-top:10px;font-size:12px;word-break:break-all;text-align:left></div></div><script>const ui=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://ai-ton-wallet.onrender.com/tonconnect-manifest.json',buttonRootId:'ton-connect'});let cur='';const ad=document.getElementById('ad'),wi=document.getElementById('wi'),ba=document.getElementById('ba'),db=document.getElementById('db'),st=document.getElementById('st');ui.onStatusChange(async w=>{if(w){cur=w.account.address;wi.style.display='block';db.style.display='block';ad.textContent=w.account.address.slice(0,6)+'...'+w.account.address.slice(-4);try{let r=await fetch('https://toncenter.com/api/v2/jsonRPC',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:1,jsonrpc:'2.0',method:'getAddressInformation',params:{address:w.account.address}})});let d=await r.json();ba.textContent=d.result?(parseInt(d.result.balance)/1e9).toFixed(4)+' TON':'0'}catch{ba.textContent='0'}}else{wi.style.display='none';db.style.display='none';cur=''}});document.getElementById('sb').onclick=async()=>{let t=document.getElementById('to').value.trim(),a=document.getElementById('am').value.trim();if(!ui.wallet){alert('Connect first');return}if(!t||!a){alert('Enter address+amount');return}try{st.style.display='block';st.innerHTML='⏳ Approve in Tonkeeper...';let tx={validUntil:Math.floor(Date.now()/1000)+600,messages:[{address:t,amount:(parseFloat(a)*1e9).toString()}]};await ui.sendTransaction(tx);st.innerHTML='✅ Sent '+a+' TON!<br>To:'+t.slice(0,15)+'...<br><br><a class=l href="https://tonscan.org/address/'+cur+'" target=_blank>🔍 View YOUR wallet on Tonscan</a><a class=l href="https://tonviewer.com/'+cur+'" target=_blank>👁️ View on Tonviewer</a><a class=l href="https://tonscan.org/address/'+t+'" target=_blank>➡️ View Recipient on Tonscan</a>';}catch(e){st.innerHTML='❌ '+(e.message||'Rejected');}};db.onclick=()=>ui.disconnect();</script><div style="max-width:400px;margin:20px auto;padding:16px;background:#161616;border:1px solid gold;border-radius:18px;"><h2 style="color:gold;text-align:center">❓ FAQ</h2><details style="background:#0a0a0a;padding:12px;border-radius:10px;margin:10px 0;color:white;border:1px solid #333"><summary><b>Is wallet safe?</b></summary><p style="margin-top:8px">Yes TON Connect official, no key saved.</p></details><details style="background:#0a0a0a;padding:12px;border-radius:10px;margin:10px 0;color:white;border:1px solid #333"><summary><b>Join REFFRALHUB?</b></summary><p style="margin-top:8px">t.me/REFFRALHUB</p></details></div></body></html>
