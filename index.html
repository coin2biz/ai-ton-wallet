<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TON WALLET</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>:root{--g:#D4AF37;--g2:#FFD700}*{box-sizing:border-box;margin:0;padding:0}body{background:#000;color:#fff;font-family:sans-serif;padding:16px}.h{text-align:center;padding:20px}.logo{font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--g),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.c{background:#111;border:1px solid var(--g);border-radius:24px;padding:20px;margin:14px 0}.btn{width:100%;padding:16px;border-radius:32px;border:none;font-weight:800;font-size:16px;margin-top:10px}.bg{background:linear-gradient(90deg,var(--g),var(--g2));color:#000}.bd{background:#222;color:#fff;border:1px solid #333}.a{font-family:monospace;font-size:12px;word-break:break-all;color:var(--g);background:#000;padding:12px;border-radius:12px;margin:10px 0}.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.sw{background:#1a1a1a;border:1px solid #333;padding:8px;border-radius:8px;font-size:13px}.sw b{color:var(--g);margin-right:4px}.bal{font-size:34px;font-weight:900;text-align:center}.qr{background:#fff;padding:12px;border-radius:16px;display:inline-block}input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin-top:10px}</style></head><body><div class="h"><div class="logo">⚡ AI TON WALLET</div><p style="color:#888;font-size:11px;letter-spacing:2px">NON-CUSTODIAL • PREMIUM</p></div><div id="s1" class="c"><h3>Welcome</h3><p style="color:#888;font-size:13px;margin:8px 0">Secure TON wallet. Your keys, your crypto.</p><button class="btn bg" onclick="createW()">CREATE NEW WALLET</button><button class="btn bd" onclick="importW()">IMPORT WALLET</button></div><div id="s2" class="c" style="display:none"><h3>🔐 Secret Phrase - SAVE IT</h3><p style="color:#f44;font-size:11px">Write on paper. Never share.</p><div id="grid" class="sg"></div><button class="btn bd" onclick="navigator.clipboard.writeText(mn.join(' '));alert('Copied')">COPY</button><button class="btn bg" onclick="showW()">I SAVED IT</button></div><div id="s3" class="c" style="display:none;text-align:center"><p style="color:#888;font-size:11px">TON BALANCE</p><div class="bal" id="bal">0.00 TON</div><p id="short" style="color:#888;font-size:10px"></p><div class="a" id="full"></div><button class="btn bg" onclick="hideAll();document.getElementById('s4').style.display='block'">SEND</button><button class="btn bd" onclick="showR()">RECEIVE</button><button class="btn bd" onclick="loadBal()">REFRESH</button></div><div id="s4" class="c" style="display:none"><h3>Send TON</h3><input id="to" placeholder="EQ... address"><input id="am" placeholder="Amount TON"><button class="btn bg" onclick="alert('Receive working. Send needs API key')">SEND</button><button class="btn bd" onclick="showW()">BACK</button></div><div id="s5" class="c" style="display:none;text-align:center"><h3>Receive TON</h3><div id="qr" class="qr" style="margin:12px auto"></div><div class="a" id="rAddr"></div><button class="btn bd" onclick="navigator.clipboard.writeText(addr.toString(true,true,true));alert('Copied')">COPY</button><button class="btn bd" onclick="showW()">BACK</button></div><script>let tonweb=new TonWeb(new TonWeb.HttpProvider('https://toncenter.com/api/v2/jsonRPC')),kp,wallet,addr,mn=[];function hideAll(){['s1','s2','s3','s4','s5'].forEach(i=>document.getElementById(i).style.display='none')}async function createW(){mn=TonWeb.mnemonic.generateMnemonic();kp=await TonWeb.mnemonic.mnemonicToKeyPair(mn);let C=TonWeb.Wallets.all.v4R2;wallet=new C(tonweb.provider,{publicKey:kp.publicKey});addr=await wallet.getAddress();localStorage.setItem('ai_mn',JSON.stringify(mn));let g=document.getElementById('grid');g.innerHTML='';mn.forEach((v,i)=>{let d=document.createElement('div');d.className='sw';d.innerHTML='<b>'+(i+1)+'</b>'+v;g.appendChild(d)});hideAll();document.getElementById('s2').style.display='block'}function showW(){document.getElementById('full').innerText=addr.toString(true,true,true);document.getElementById('rAddr').innerText=addr.toString(true,true,true);document.getElementById('short').innerText=addr.toString(true,true,true).slice(0,6)+'...'+addr.toString(true,true,true).slice(-4);hideAll();document.getElementById('s3').style.display='block';loadBal()}async function loadBal(){try{let b=await tonweb.provider.getBalance(addr.toString(true,true,true));document.getElementById('bal').innerText=(parseInt(b)/1e9).toFixed(4)+' TON'}catch(e){document.getElementById('bal').innerText='-- TON'}}function showR(){hideAll();document.getElementById('s5').style.display='block';document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:addr.toString(true,true,true),width:160,height:160})}async function importW(){let p=prompt('Enter 12 words:');if(!p)return;try{mn=p.trim().split(/\s+/);kp=await TonWeb.mnemonic.mnemonicToKeyPair(mn);let C=TonWeb.Wallets.all.v4R2;wallet=new C(tonweb.provider,{publicKey:kp.publicKey});addr=await wallet.getAddress();localStorage.setItem('ai_mn',JSON.stringify(mn));showW()}catch(e){alert('Invalid')}}window.addEventListener('load',async()=>{let s=localStorage.getItem('ai_mn');if(s){try{mn=JSON.parse(s);kp=await TonWeb.mnemonic.mnemonicToKeyPair(mn);let C=TonWeb.Wallets.all.v4R2;wallet=new C(tonweb.provider,{publicKey:kp.publicKey});addr=await wallet.getAddress();showW()}catch(e){}}if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}})</script></body></html>
