<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Empire Factory - $69</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.34/dist/tonweb.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}.top{text-align:center;font-size:22px;font-weight:900;padding:16px;color:#f5c842}.card{background:#151515;border:1px solid #333;border-radius:18px;padding:16px;margin:12px auto;max-width:420px;text-align:center}.price{font-size:48px;font-weight:900;color:#f5c842}.small{color:#aaa;font-size:12px}.btn{background:#f5c842;color:#000;border:0;width:100%;padding:15px;border-radius:12px;font-weight:900;margin-top:12px;font-size:17px;cursor:pointer}.btn2{background:#222;color:#f5c842;border:1px solid #444;width:100%;padding:12px;border-radius:10px;margin-top:8px;cursor:pointer}.qrbox{background:#fff;padding:10px;border-radius:14px;width:150px;height:150px;margin:14px auto;display:flex;align-items:center;justify-content:center}.addr{font-family:monospace;font-size:10px;word-break:break-all;color:#888;margin-top:8px;background:#0a0a0a;padding:8px;border-radius:8px}input{width:92%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin-top:10px}.lock{font-size:52px}</style></head><body><div class="top">⚡ MINI EMPIRE FACTORY</div><div class="card" id="paycard"><div class="lock">🔒</div><div style="font-weight:800;font-size:18px">Create Your Own Mini App</div><div class="price">$69</div><div class="small">One-time → Create unlimited apps</div><div class="qrbox"><div id="qr"></div></div><div class="small">Send <b style="color:#fff">20 TON</b> to treasury:</div><div class="addr">EQBXNB8pAoPMNkqdX49yaKhZYAy8XxFe_3-ByV4IoyFm1uBl</div><button class="btn" onclick="copyAddr()">📋 COPY ADDRESS</button><button class="btn2" onclick="checkPay()">✅ I PAID - UNLOCK</button><div id="status" style="margin-top:10px;color:#f5c842;font-size:12px">Waiting for 20 TON...</div></div><div class="card" id="factory" style="display:none"><div style="font-size:40px">🚀</div><div style="font-size:20px;font-weight:900;color:#22c55e">UNLOCKED!</div><div class="small">You paid $69 - Now create</div><input id="appname" placeholder="App Name"><input id="apptype" placeholder="Type: Wallet / Shop / Game"><button class="btn" onclick="createApp()">CREATE MY APP NOW</button><div id="applist" style="margin-top:14px;text-align:left"></div><button class="btn2" onclick="lockAgain()">🔒 Lock Again</button></div><script>let tg={};try{tg=Telegram.WebApp;tg.expand();}catch(e){}const TREASURY="EQBXNB8pAoPMNkqdX49yaKhZYAy8XxFe_3-ByV4IoyFm1uBl";const NEED=19;function showQR(t){document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:t,width:140,height:140});}function copyAddr(){navigator.clipboard.writeText(TREASURY);document.getElementById('status').innerText="Copied! Send 20 TON";}async function checkPay(){let s=document.getElementById('status');s.innerText="Checking blockchain...";try{let r=await fetch('https://toncenter.com/api/v2/jsonRPC',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:1,jsonrpc:"2.0",method:"getTransactions",params:{address:TREASURY,limit:15,from_lt:0,archival:true}})});let j=await r.json();let found=false;if(j.result){for(let tx of j.result){let m=tx.in_msg;if(m&&m.value){let v=parseInt(m.value)/1e9;if(v>=NEED){found=true;break;}}}}let b=await fetch('https://toncenter.com/api/v2/jsonRPC',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:1,jsonrpc:"2.0",method:"getAddressBalance",params:{address:TREASURY}})});let bj=await b.json();let bal=parseInt(bj.result||0)/1e9;s.innerHTML="Balance: "+bal.toFixed(2)+" TON<br>";if(found||bal>=NEED||localStorage.getItem('empire_paid')==='yes'){unlock();s.innerText="Verified! "+bal.toFixed(2)+" TON - UNLOCKED";}else{s.innerHTML="No 20 TON yet. Bal: "+bal.toFixed(2)+"<br>Click again for demo unlock";if(window.c){window.c++;if(window.c>=2){unlock();}}else{window.c=1;}}}catch(e){s.innerText="Demo unlock: "+e.message;unlock();}}function unlock(){localStorage.setItem('empire_paid','yes');document.getElementById('paycard').style.display='none';document.getElementById('factory').style.display='block';loadApps();}function lockAgain(){localStorage.removeItem('empire_paid');document.getElementById('paycard').style.display='block';document.getElementById('factory').style.display='none';}function createApp(){let n=document.getElementById('appname').value||"My Empire App";let t=document.getElementById('apptype').value||"Mini App";let apps=JSON.parse(localStorage.getItem('my_apps')||"[]");apps.push({name:n,type:t,date:new Date().toLocaleString()});localStorage.setItem('my_apps',JSON.stringify(apps));alert("✅ App '"+n+"' Created! #"+apps.length);loadApps();document.getElementById('appname').value="";}function loadApps(){let apps=JSON.parse(localStorage.getItem('my_apps')||"[]");let h="";if(apps.length>0){h="<div style='color:#f5c842;font-weight:800'>Your Empire ("+apps.length+"):</div>";apps.reverse().forEach(a=>{h+="<div style='background:#000;border:1px solid #333;border-radius:10px;padding:8px;margin-top:6px;font-size:12px'><b>"+a.name+"</b> - "+a.type+"<br><span style='color:#888'>"+a.date+"</span></div>";});}document.getElementById('applist').innerHTML=h;}showQR("ton://transfer/"+TREASURY+"?amount="+(20*1e9));if(localStorage.getItem('empire_paid')==='yes'){unlock();}loadApps();</script></body></html>
