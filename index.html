<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI TON WALLET V5</title><script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script><style>body{margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial} .phone{width:380px;background:#15151f;border:3px solid #d4af37;border-radius:30px;padding:25px;position:relative} .title{text-align:center;color:#f9d76b;font-size:22px;font-weight:700} .balance{text-align:center;color:#00d9ff;margin:15px 0} #qrcode{display:flex;justify-content:center;margin:20px 0;background:#fff;padding:15px;border-radius:15px} .label{color:#aaa;font-size:12px;margin:10px 0 5px} input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#1f1f2e;color:#fff;box-sizing:border-box} .send-btn{width:100%;margin-top:15px;padding:14px;background:#ffdd33;color:#000;border:0;border-radius:12px;font-weight:700;font-size:16px} .footer{text-align:center;color:#666;font-size:10px;margin-top:12px} #botBtn{position:absolute;bottom:15px;right:15px;width:58px;height:58px;background:#22283a;border:2px solid #d4af37;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 0 15px #ffdd33} #chatPopup{position:absolute;bottom:80px;right:15px;background:#fff;color:#000;padding:10px 12px;border-radius:12px;width:190px;display:none} #chatPopup.show{display:block}</style></head><body><div class="phone"><div class="title">🤖 AI TON WALLET</div><div class="balance">💎 1.25 TON balance</div><div id="ton-connect" style="display:flex;justify-content:center;margin:10px 0"></div><div id="qrcode"><canvas id="qrCanvas"></canvas></div><div style="text-align:center;color:#888;font-size:11px">Scan to receive TON</div><div class="label">Recipient UQ... / EQ...</div><input id="recipient" placeholder="UQ... wallet"><div class="label">Amount e.g. 0.05</div><input id="amount" value="0.05" type="number"><button class="send-btn" onclick="sendTON()">Send TON</button><div class="footer">🛡️ Secured • Chennai • Trusted Wallet</div><div id="botBtn" onclick="document.getElementById('chatPopup').classList.toggle('show')">🤖</div><div id="chatPopup">Hi da! balance / send nu kelu 🤖</div></div><script>const tonConnectUI=new TON_CONNECT_UI.TonConnectUI({manifestUrl:'https://ton-connect.github.io/demo-dapp-with-react-ui/tonconnect-manifest.json',buttonRootId:'ton-connect'});QRCode.toCanvas(document.getElementById('qrCanvas'),'UQDemoChennaiReceive',{width:160});async function sendTON(){const to=document.getElementById('recipient').value;const amt=document.getElementById('amount').value;if(!to||!amt)return alert('Address & Amount podu da!');const tx={validUntil:Math.floor(Date.now()/1000)+300,messages:[{address:to,amount:(parseFloat(amt)*1e9).toString()}]};try{await tonConnectUI.sendTransaction(tx);alert('TON Sent da!')}catch(e){alert(e.message)}}</script></body></html>
